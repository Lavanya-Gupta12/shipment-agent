name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check mcp_server agent scripts core api tests

      - name: Syntax check
        run: |
          python -m py_compile mcp_server/server.py agent/main.py api/main.py scripts/setup_aws.py

      - name: Run tests (moto-mocked AWS, no real credentials needed)
        run: pytest tests/ -v
